[pytest]
# From the repository root, with the venv the core's scripts/dev-install.sh creates:
#   opsdir/.venv/bin/python -m pytest                   unit tests: core, packages, showcase (no database)
#   opsdir/.venv/bin/python -m pytest -m integration    integration tests (Postgres; see opsdir/README.md, Database)
#   opsdir/.venv/bin/python -m pytest -m terraform      rendered Terraform checked by Terraform (tools/bin/terraform)
#   opsdir/.venv/bin/python -m pytest -m kubernetes     rendered Kubernetes output checked by kustomize, helm, kubeconform
#   opsdir/.venv/bin/python -m pytest -m ansible        rendered Ansible checked by ansible-inventory, --syntax-check, ansible-lint
#   opsdir/.venv/bin/python -m pytest -m cloudformation rendered CloudFormation checked by cfn-lint (tools/cfn-lint)
#   opsdir/.venv/bin/python -m pytest -m bicep          rendered Bicep / ARM JSON checked by bicep build and lint (tools/bin)
#   opsdir/scripts/test.sh                              everything, databases required
testpaths = opsdir/tests packages examples/showcase/tests
pythonpath = opsdir/tests examples/showcase/tests examples/showcase examples/showcase/tests/terraform
addopts = -ra -m "not integration and not terraform and not kubernetes and not ansible and not cloudformation and not bicep" --import-mode=importlib
markers =
    integration: runs against PostgreSQL (OPSDIR_TEST_DSN / OPSDIR_TEST_WORKSPACE_DSN); drops and reloads their opsdir schema
    terraform: runs the local Terraform (tools/bin/terraform, opsdir/scripts/fetch-tools.sh) on rendered output; skipped without it
    kubernetes: runs the local kustomize, helm and kubeconform (tools/bin, opsdir/scripts/fetch-tools.sh) on rendered output; skipped without them
    ansible: runs the pinned ansible-core and ansible-lint (tools/ansible, opsdir/scripts/fetch-tools.sh) on rendered output; skipped without them
    cloudformation: runs the pinned cfn-lint (tools/cfn-lint, opsdir/scripts/fetch-tools.sh) on rendered templates; skipped without it
    bicep: runs the pinned Bicep CLI (tools/bin/bicep, opsdir/scripts/fetch-tools.sh) on rendered Bicep; skipped without it
