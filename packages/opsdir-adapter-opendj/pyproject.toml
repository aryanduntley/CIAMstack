[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-opendj"
version = "0.1.0"
description = "opsdir adapter for OpenDJ: dsconfig batch, ACI LDIF, setup and dsreplication scripts, replication checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1", "opsdir-base-ds>=0.1"]

[project.entry-points."opsdir.adapters"]
opendj = "opsdir_adapter_opendj.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
