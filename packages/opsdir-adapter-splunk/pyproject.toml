[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-splunk"
version = "0.1.0"
description = "opsdir SIEM add-on: the Splunk indexes an environment keeps logs in, with their retention, its detections as saved searches and Universal Forwarder inputs; read back from the .conf files and the management API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
splunk = "opsdir_adapter_splunk.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
