[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-jira-sm"
version = "0.1.0"
description = "opsdir ITSM add-on for Jira Service Management: the change tickets the record's changes name, read as evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
jira-sm = "opsdir_adapter_jira_sm.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
