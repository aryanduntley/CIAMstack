[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-base-oidc"
version = "0.1.0"
description = "opsdir OAuth 2.0 / OpenID Connect base: client registration metadata and the discovery document rendered from the federation domain, for product adapters to build on."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[tool.setuptools.packages.find]
where = ["src"]
