[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-elastic"
version = "0.1.0"
description = "opsdir SIEM add-on: the Elastic Security data streams an environment keeps logs in, with their index lifecycle and snapshot archive, and its detections as ES|QL rules; read back from the Elasticsearch and Kibana APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1", "opsdir-format-terraform>=0.1"]

[project.entry-points."opsdir.adapters"]
elastic = "opsdir_adapter_elastic.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
