[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-forgeops"
version = "0.1.0"
description = "opsdir adapter for ForgeOps: Helm values and Kustomize overlays for PingAM, PingIDM, PingDS and PingGateway on Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1", "opsdir-adapter-kubernetes>=0.1"]

[project.entry-points."opsdir.adapters"]
forgeops = "opsdir_adapter_forgeops.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
