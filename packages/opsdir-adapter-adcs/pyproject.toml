[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-adcs"
version = "0.1.0"
description = "opsdir PKI adapter for Microsoft Active Directory Certificate Services: its CAs, certificate templates, revocation endpoints and issued-certificate inventory read into the record, metadata only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
adcs = "opsdir_adapter_adcs.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
