[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-venafi"
version = "0.1.0"
description = "opsdir PKI adapter for Venafi / CyberArk Certificate Manager - Self-Hosted: policy folders' certificates read as a certificate manager's inventory, metadata only, GET-only."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
venafi = "opsdir_adapter_venafi.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
