[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-kubernetes"
version = "0.1.0"
description = "opsdir adapter for Kubernetes: k8s-secret:// secret references."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
kubernetes = "opsdir_adapter_kubernetes.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
