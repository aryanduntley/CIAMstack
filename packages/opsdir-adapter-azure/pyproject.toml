[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-azure"
version = "0.1.0"
description = "opsdir adapter for Microsoft Azure: Terraform for Azure environments and azkv:// secret references."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1", "opsdir-format-terraform>=0.1"]

[project.entry-points."opsdir.adapters"]
azure = "opsdir_adapter_azure.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
