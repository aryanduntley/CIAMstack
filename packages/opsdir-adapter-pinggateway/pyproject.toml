[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-pinggateway"
version = "0.1.0"
description = "opsdir adapter for PingGateway (ForgeRock Identity Gateway): routes to protected applications, per environment; import from a gateway configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
pinggateway = "opsdir_adapter_pinggateway.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
