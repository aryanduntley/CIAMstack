# Access Gateway server.conf (synthetic, from the documented section shape)
<Server>
  http_connection_pool_min_size="4"
</Server>
<SSL>
  ClientKeyFile="/opt/ca/secure-proxy/SSL/clientkeys/client.key"
  ClientPassPhrase="{AES}gateway-key-passphrase"
</SSL>
<ServiceDispatcher>
  rules_file="/opt/ca/secure-proxy/proxy-engine/conf/proxyrules.xml"
</ServiceDispatcher>
<VirtualHostDefaults>
  defaultsessionscheme="default"
</VirtualHostDefaults>
<VirtualHost name="parts">
  hostnames="parts.example.test"
  enablerewritecookiepath="no"
  <WebAgent>
    sminitfile="/opt/ca/secure-proxy/proxy-engine/conf/partsagent/WebAgent.conf"
  </WebAgent>
</VirtualHost>
