[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-github-actions"
version = "0.1.0"
description = "opsdir delivery adapter for GitHub Actions: repositories' workflows read as the platform's pipeline jobs (schedules, triggers, runners, environments, secrets by name)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1", "pyyaml>=6"]

[project.entry-points."opsdir.adapters"]
github-actions = "opsdir_adapter_github_actions.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
