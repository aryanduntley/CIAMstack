[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-panos"
version = "0.1.0"
description = "opsdir network-firewall add-on: the firewall rules an environment records, as Palo Alto Networks security rules (PAN-OS firewalls or Panorama), pushed by Ansible."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1", "opsdir-adapter-ansible>=0.1"]

[project.entry-points."opsdir.adapters"]
panos = "opsdir_adapter_panos.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
