[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-bmc-helix"
version = "0.1.0"
description = "opsdir ITSM add-on for BMC Helix ITSM and Remedy: the change tickets the record's changes name, read as evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
bmc-helix = "opsdir_adapter_bmc_helix.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
