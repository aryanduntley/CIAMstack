[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-ldap"
version = "0.1.0"
description = "opsdir standard LDAPv3 base: the user directory's schema and tree as standard LDIF, and a generic adapter for any compliant server."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
ldap = "opsdir_adapter_ldap.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
