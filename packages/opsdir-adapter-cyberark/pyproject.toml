[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-cyberark"
version = "0.1.0"
description = "opsdir adapter for CyberArk (privileged access management): cyberark:// secret references."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
cyberark = "opsdir_adapter_cyberark.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
