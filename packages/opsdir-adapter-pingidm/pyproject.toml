[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-pingidm"
version = "0.1.0"
description = "opsdir adapter for PingIDM (ForgeRock IDM): managed objects, connectors, sync mappings and schedules; import from an IDM project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
pingidm = "opsdir_adapter_pingidm.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
