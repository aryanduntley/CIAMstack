[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-pingds"
version = "0.1.0"
description = "opsdir adapter for PingDS (ForgeRock Directory Services): dsconfig batch, ACI LDIF, setup scripts, replication checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1", "opsdir-base-ds>=0.1"]

[project.entry-points."opsdir.adapters"]
pingds = "opsdir_adapter_pingds.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
