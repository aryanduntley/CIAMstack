[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-pingaccess"
version = "0.1.0"
description = "opsdir adapter for PingAccess: protected applications, web sessions, identity mappings and policies as Admin API requests per environment; import from Admin API reads or a configuration export."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
pingaccess = "opsdir_adapter_pingaccess.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
