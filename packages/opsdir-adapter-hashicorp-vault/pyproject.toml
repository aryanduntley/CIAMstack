[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-hashicorp-vault"
version = "0.1.0"
description = "opsdir adapter for HashiCorp Vault: vault:// secret references."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
hashicorp-vault = "opsdir_adapter_hashicorp_vault.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
