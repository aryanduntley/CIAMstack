[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir-adapter-onprem"
version = "0.1.0"
description = "opsdir provider adapter for environments on the operators' own hardware: sites as the region catalog, keepers of what fronts and connects them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["opsdir>=0.1"]

[project.entry-points."opsdir.adapters"]
onprem = "opsdir_adapter_onprem.adapter:ADAPTER"

[tool.setuptools.packages.find]
where = ["src"]
