# Generated by opsdir from env=prod,cloud=source,ou=environments,dc=ciam-ops
# Variables role ds's hosts read
# Do not edit. Change the operations directory (under an approved change) and re-render.
ciam_role: ds
ciam_os: rhel 9.4
ciam_jdk: temurin 17.0.11
ciam_kernel_settings:
  - name: net.core.somaxconn
    value: "4096"
  - name: net.ipv4.tcp_keepalive_time
    value: "600"
ciam_limits:
  - domain: ds
    type: soft
    item: nofile
    value: "65536"
  - domain: ds
    type: hard
    item: nofile
    value: "65536"
ciam_transparent_hugepages: never
ciam_fips_mode: false
ciam_selinux_mode: enforcing
ciam_host_agents:
  - package: amazon-cloudwatch-agent
    recorded: amazon-cloudwatch-agent 1.300034.0
  - package: amazon-ssm-agent
    recorded: amazon-ssm-agent 3.3.40.0
  - package: falcon-sensor
    recorded: falcon-sensor 7.10.0
  - package: splunkforwarder
    recorded: splunkforwarder 9.2.1
ciam_service_units:
  - pingds.service
ciam_cron_jobs:
  - name: ds-nightly-export
    job: /opt/scripts/nightly-export.sh
    user: mroexp
    minute: "30"
    hour: "2"
    day: "*"
    month: "*"
    weekday: "*"
ciam_firewall_rules:
  - "rule family=\"ipv4\" source address=\"10.20.9.0/28\" port port=\"4444\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.30.8.0/24\" port port=\"1636\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.6.0/24\" port port=\"1636\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.40.7.22/32\" port port=\"1636\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.40.12.0/24\" port port=\"1636\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.4.0/24\" port port=\"1636\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.5.0/24\" port port=\"1636\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.1.0/24\" port port=\"8989\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.2.0/24\" port port=\"8989\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.3.0/24\" port port=\"8989\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.60.1.0/24\" port port=\"8989\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.31.2.0/24\" port port=\"1636\" protocol=\"tcp\" accept"
ciam_host_files:
  - src: host-files/ds/ds-1/opt/aws/amazon-cloudwatch-agent/etc/opsdir-logs.json.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/opsdir-logs.json
    mode: "0644"
    reload:
      - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
      - "-a"
      - append-config
      - "-m"
      - ec2
      - "-s"
      - "-c"
      - file:/opt/aws/amazon-cloudwatch-agent/etc/opsdir-logs.json
    hosts:
      - ds-1.aws.internal.example-aero.test
      - ds-2.aws.internal.example-aero.test
      - ds-3.aws.internal.example-aero.test
