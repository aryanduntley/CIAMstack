# Generated by opsdir from env=prod,cloud=source,ou=environments,dc=ciam-ops
# Variables role pf-engine's hosts read
# Do not edit. Change the operations directory (under an approved change) and re-render.
ciam_role: pf-engine
ciam_os: rhel 9.4
ciam_jdk: temurin 17.0.11
ciam_kernel_settings:
  - name: net.core.somaxconn
    value: "4096"
  - name: net.ipv4.tcp_keepalive_time
    value: "600"
ciam_limits:
  - domain: pingfed
    type: soft
    item: nofile
    value: "65536"
  - domain: pingfed
    type: hard
    item: nofile
    value: "65536"
ciam_transparent_hugepages: never
ciam_fips_mode: false
ciam_selinux_mode: enforcing
ciam_trusted_unrecorded:
  - "7A:3F:91:C2:5E:08:D4:6B:12:AF:E3:57:90:C8:1D:44:B6:2E:F9:03:8A:75:CC:61:0D:9E:43:B8:27:F5:6A:19"
ciam_host_agents:
  - package: amazon-cloudwatch-agent
    recorded: amazon-cloudwatch-agent 1.300034.0
  - package: amazon-ssm-agent
    recorded: amazon-ssm-agent 3.3.40.0
  - package: falcon-sensor
    recorded: falcon-sensor 7.10.0
  - package: splunkforwarder
    recorded: splunkforwarder 9.2.1
ciam_service_units:
  - pingfederate.service
ciam_timer_jobs:
  - unit: opsdir-pf-engine-pf-audit-ship
    description: pf-engine-pf-audit-ship (opsdir)
    exec_start: "/bin/sh -c \"/opt/scripts/ship-audit.sh /opt/pingfederate/log/audit.log\""
    user: pingfed
    schedule:
      - "OnCalendar=*:0/15"
ciam_firewall_rules:
  - "rule family=\"ipv4\" source address=\"10.20.4.0/24\" port port=\"7600\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.4.0/24\" port port=\"7700\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.5.0/24\" port port=\"7600\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.20.5.0/24\" port port=\"7700\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"0.0.0.0/0\" port port=\"443\" protocol=\"tcp\" accept"
ciam_config_files:
  - src: pingfederate/bin/run.properties.j2
    dest: /opt/pingfederate/bin/run.properties
ciam_host_files:
  - src: host-files/pf-engine/pf-engine-1/opt/aws/amazon-cloudwatch-agent/etc/opsdir-logs.json.j2
    dest: /opt/aws/amazon-cloudwatch-agent/etc/opsdir-logs.json
    mode: "0644"
    reload:
      - /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
      - "-a"
      - append-config
      - "-m"
      - ec2
      - "-s"
      - "-c"
      - file:/opt/aws/amazon-cloudwatch-agent/etc/opsdir-logs.json
    hosts:
      - pf-engine-1.aws.internal.example-aero.test
      - pf-engine-2.aws.internal.example-aero.test
