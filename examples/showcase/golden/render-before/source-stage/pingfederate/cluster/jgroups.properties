# PingFederate cluster discovery for source/stage: the discovery lines of each node's bin/jgroups.properties (server/default/conf/tcp.xml holds ${DISCOVERY_TAG})
pf.cluster.discovery.protocol=NATIVE_S3_PING
pf.cluster.NATIVE_S3_PING.region_name=us-east-1
pf.cluster.NATIVE_S3_PING.bucket_name=example-aero-ciam-stage-pf-cluster
pf.cluster.NATIVE_S3_PING.remove_all_data_on_view_change=true
pf.cluster.NATIVE_S3_PING.write_data_on_find=true
