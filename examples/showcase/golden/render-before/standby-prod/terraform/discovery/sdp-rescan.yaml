# Generated by opsdir from env=prod,cloud=standby,ou=environments,dc=ciam-ops
# Workflows: resume and pause a Sensitive Data Protection discovery config every N days
# Do not edit. Change the operations directory (under an approved change) and re-render.
main:
  steps:
    - init:
        assign:
          - parent: ${sys.get_env("PARENT")}
          - parts: ${text.split(sys.get_env("CONFIG"), "/")}
          - config: ${parent + "/discoveryConfigs/" + parts[len(parts) - 1]}
          - days: ${int(sys.get_env("RESCAN_DAYS"))}
          - buckets: ${text.split(sys.get_env("BUCKETS"), ",")}
          - today: ${int(sys.now()) // 86400}
          - oldest: -1
          - unprofiled: false
    - read_config:
        call: http.get
        args:
          url: ${"https://dlp.googleapis.com/v2/" + config}
          auth:
            type: OAuth2
        result: cfg
    - each_bucket:
        for:
          value: bucket
          in: ${buckets}
          steps:
            - list:
                call: http.get
                args:
                  url: ${"https://dlp.googleapis.com/v2/" + parent + "/fileStoreDataProfiles"}
                  auth:
                    type: OAuth2
                  query:
                    filter: '${"file_store_path = \"gs://" + bucket + "\""}'
                result: page
            - found:
                assign:
                  - profiles: ${default(map.get(page.body, "fileStoreDataProfiles"), [])}
            - none:
                switch:
                  - condition: ${len(profiles) == 0 or not ("profileLastGenerated" in profiles[0])}
                    assign:
                      - unprofiled: true
                    next: continue
            - outcome:
                assign:
                  - attempt: ${default(map.get(profiles[0], "profileStatus"), {})}
                  - code: ${default(map.get(default(map.get(attempt, "status"), {}), "code"), 0)}
            - failed:
                switch:
                  - condition: ${code != 0}
                    assign:
                      - unprofiled: true
                    next: continue
            - generated:
                assign:
                  - day: ${int(time.parse(profiles[0].profileLastGenerated)) // 86400}
            - older:
                switch:
                  - condition: ${oldest == -1 or day < oldest}
                    assign:
                      - oldest: ${day}
    - decide:
        assign:
          - due: ${unprofiled or oldest == -1 or today - oldest >= days}
          - wanted: PAUSED
    - when_due:
        switch:
          - condition: ${due}
            assign:
              - wanted: RUNNING
    - unchanged:
        switch:
          - condition: ${cfg.body.status == wanted}
            next: done
    - set_status:
        call: http.patch
        args:
          url: ${"https://dlp.googleapis.com/v2/" + config}
          auth:
            type: OAuth2
          body:
            discoveryConfig:
              status: ${wanted}
            updateMask: status
    - done:
        return: ${wanted}
