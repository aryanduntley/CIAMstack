      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_ADMIN_PASSWORD
  rbac:
    serviceAccountName: pingfederate
  workload:
    labels:
      opsdir.io/role: pf-engine
      azure.workload.identity/use: "true"
    annotations:
      opsdir.io/cluster-role: k8s-cluster
      opsdir.io/workload-role: pf-engine-workload
      opsdir.io/identity-role: identity-pf
      opsdir.io/workload: pf-engine
      opsdir.io/derived-containers: pf-log-runtime-request,pf-log-request,pf-log-runtime-api,pf-log-audit,pf-log-provisioner-audit
  envs:
    SERVER_PROFILE_URL: https://git.example-aero.test/ciam/server-profiles.git
    SERVER_PROFILE_PATH: pingfederate
    SERVER_PROFILE_BRANCH: main
  includeSidecars:
  - pf-log-runtime-request
