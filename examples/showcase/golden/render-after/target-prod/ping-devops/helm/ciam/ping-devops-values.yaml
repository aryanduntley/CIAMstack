# Generated by opsdir from env=prod,cloud=target,ou=environments,dc=ciam-ops
# ping-devops 0.16.0 Helm values: helm upgrade --install pingfederate ping-devops --repo https://helm.pingidentity.com/ --version 0.16.0 --namespace ciam -f <this file>
# Do not edit. Change the operations directory (under an approved change) and re-render.
global:
  envs:
    PING_IDENTITY_ACCEPT_EULA: "YES"
pingfederate-admin:
  enabled: true
  image:
    repositoryFqn: crciamprod.azurecr.io/ciam/pingfederate
    tag: "12.1.4"
  container:
    replicaCount: 1
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        memory: "4Gi"
    env:
    - name: PING_IDENTITY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-admin
          key: PING_IDENTITY_PASSWORD
  rbac:
    serviceAccountName: pingfederate
  workload:
    labels:
      opsdir.io/role: pf-admin
      azure.workload.identity/use: "true"
    type: StatefulSet
    statefulSet:
      persistentvolume:
        enabled: true
        volumes:
          out-dir:
            persistentVolumeClaim:
              storageClassName: managed-csi-premium
              resources:
                requests:
                  storage: "8Gi"
pingfederate-engine:
  enabled: true
  image:
    repositoryFqn: crciamprod.azurecr.io/ciam/pingfederate
    tag: "12.1.4"
  container:
    replicaCount: 2
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        memory: "4Gi"
  rbac:
    serviceAccountName: pingfederate
  workload:
    labels:
      opsdir.io/role: pf-engine
      azure.workload.identity/use: "true"
  ingress:
    enabled: true
    hosts:
    - host: sso.example-aero.test
      paths:
      - path: /
        pathType: Prefix
        backend:
          serviceName: https
    tls:
    - secretName: _defaultTlsSecret_
      hosts:
      - sso.example-aero.test
