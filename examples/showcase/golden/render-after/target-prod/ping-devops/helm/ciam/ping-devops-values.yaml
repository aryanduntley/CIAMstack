# Generated by opsdir from env=prod,cloud=target,ou=environments,dc=ciam-ops
# ping-devops 0.16.0 Helm values: helm upgrade --install pingfederate ping-devops --repo https://helm.pingidentity.com/ --version 0.16.0 --namespace ciam -f <this file>
# Do not edit. Change the operations directory (under an approved change) and re-render.
global:
  envs:
    PING_IDENTITY_ACCEPT_EULA: "YES"
pingfederate-admin:
  enabled: true
  image:
    repositoryFqn: crciamprod.azurecr.io/ciam/pingfederate
    tag: "13.1.3"
  container:
    replicaCount: 1
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    env:
    - name: PING_IDENTITY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-admin
          key: PING_IDENTITY_PASSWORD
    - name: OPSDIR_PF_SIGNING_KEY
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_SIGNING_KEY
    - name: OPSDIR_PF_SIGNING_KEY_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_SIGNING_KEY_PASSWORD
    - name: OPSDIR_SSO_TLS_KEYSTORE
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_SSO_TLS_KEYSTORE
    - name: OPSDIR_SSO_TLS_KEYSTORE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_SSO_TLS_KEYSTORE_PASSWORD
    - name: OPSDIR_PF_CORP_AD_BIND_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_CORP_AD_BIND_PASSWORD
    - name: OPSDIR_PF_GRANTS_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_GRANTS_DB_PASSWORD
    - name: OPSDIR_PF_DS_BIND_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_DS_BIND_PASSWORD
    - name: OPSDIR_PF_SMTP_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_SMTP_PASSWORD
    - name: OPSDIR_PF_CAPTCHA_SECRET
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_CAPTCHA_SECRET
    - name: OPSDIR_PF_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: pf-profile
          key: OPSDIR_PF_ADMIN_PASSWORD
  rbac:
    serviceAccountName: pingfederate
  workload:
    labels:
      opsdir.io/role: pf-admin
      azure.workload.identity/use: "true"
    annotations:
      opsdir.io/cluster-role: k8s-cluster
      opsdir.io/workload-role: pf-admin-workload
      opsdir.io/identity-role: identity-pf
      opsdir.io/workload: pf-admin
      opsdir.io/derived-containers: pf-log-admin,pf-log-admin-event-detail,pf-log-admin-api,pf-log-admin-request
    type: StatefulSet
    statefulSet:
      persistentvolume:
        enabled: true
        volumes:
          out-dir:
            persistentVolumeClaim:
              storageClassName: managed-csi-premium
              resources:
                requests:
                  storage: "8Gi"
  envs:
    SERVER_PROFILE_URL: https://git.example-aero.test/ciam/server-profiles.git
    SERVER_PROFILE_PATH: pingfederate
    SERVER_PROFILE_BRANCH: main
  includeSidecars:
  - pf-log-admin
  - pf-log-admin-event-detail
  - pf-log-admin-api
  - pf-log-admin-request
pingfederate-engine:
  enabled: true
  image:
    repositoryFqn: crciamprod.azurecr.io/ciam/pingfederate
    tag: "13.1.3"
  container:
    replicaCount: 2
    resources:
      requests:
        cpu: "1"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
    env:
