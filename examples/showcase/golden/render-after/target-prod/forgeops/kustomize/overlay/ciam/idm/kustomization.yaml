                secretKeyRef:
                  name: idm-profile
                  key: OPSDIR_IDM_HRDB_PASSWORD
            - name: OPSDIR_IDM_DS_BIND_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idm-profile
                  key: OPSDIR_IDM_DS_BIND_PASSWORD
