# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# Prometheus alerting rules from the record's alert rules
# Do not edit. Change the operations directory (under an approved change) and re-render.
# NOTE: alert rule login-failures: no product rendering hq/lab declares signal `login-failures` for role `pf-engine`: not rendered
groups:
  - name: ciam-alerts-page
    rules:
      - alert: replication-lag
        expr: "(max by (instance) (ds_replication_replica_remote_replicas_receive_delay_seconds)) > 5"
        for: "5m"
        labels:
          severity: sev2
          team: ciam-platform
          ciam_rule: replication-lag
          environment: hq/lab
        annotations:
          summary: "the longest current delay receiving replicated operations from a remote replica: gt 5000 ms on ds"
          runbook: https://wiki.example-aero.test/ciam/WI-CIAM-007
