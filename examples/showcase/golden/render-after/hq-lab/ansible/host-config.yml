# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# Applies each server role's host configuration (tags baseline, stig, jobs, firewall, files, verify)
# Do not edit. Change the operations directory (under an approved change) and re-render.
- name: Host baseline of each server role (opsdir)
  hosts: ciam_servers
  become: true
  vars:
    ciam_trust_dir: "{{ '/etc/pki/ca-trust/source/anchors' if ansible_facts.os_family == 'RedHat' else '/usr/local/share/ca-certificates' }}"
  tasks:
    - name: Kernel settings
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/90-ciam.conf
        reload: true
      loop: "{{ ciam_kernel_settings | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - baseline
    - name: Resource limits
      community.general.pam_limits:
        domain: "{{ item.domain }}"
        limit_type: "{{ item.type }}"
        limit_item: "{{ item.item }}"
        value: "{{ item.value }}"
        dest: /etc/security/limits.d/90-ciam.conf
      loop: "{{ ciam_limits | default([]) }}"
      loop_control:
        label: "{{ item.domain }} {{ item.type }} {{ item.item }}"
      tags:
        - baseline
    - name: Transparent huge pages at boot
      ansible.builtin.copy:
        dest: /etc/systemd/system/ciam-transparent-hugepages.service
        content: |
          [Unit]
          Description=Transparent huge pages {{ ciam_transparent_hugepages }} (opsdir)

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/sh -c 'echo {{ ciam_transparent_hugepages }} > /sys/kernel/mm/transparent_hugepage/enabled'
          ExecStart=/bin/sh -c 'echo {{ ciam_transparent_hugepages }} > /sys/kernel/mm/transparent_hugepage/defrag'

          [Install]
          WantedBy=basic.target
        mode: "0644"
      when: ciam_transparent_hugepages is defined
      notify: Apply transparent huge pages
      tags:
        - baseline
    - name: Transparent huge pages unit enabled
      ansible.builtin.systemd_service:
        name: ciam-transparent-hugepages.service
        enabled: true
        state: started
        daemon_reload: true
      when: ciam_transparent_hugepages is defined
      tags:
        - baseline
    - name: SELinux mode
      ansible.posix.selinux:
        policy: targeted
        state: "{{ ciam_selinux_mode }}"
      when: ciam_selinux_mode is defined
      register: ciam_selinux
      tags:
        - baseline
    - name: SELinux mode needs a reboot
      ansible.builtin.debug:
        msg: "SELinux mode changed: reboot the host for it to take effect (this play doesn't reboot)"
      when: "ciam_selinux is changed and (ciam_selinux.reboot_required | default(false))"
      tags:
        - baseline
    - name: FIPS mode now
      ansible.builtin.slurp:
        src: /proc/sys/crypto/fips_enabled
      when: "ciam_fips_mode | default(false)"
      register: ciam_fips_now
      tags:
        - baseline
    - name: FIPS mode on (RHEL 8, 9)
      ansible.builtin.command:
        cmd: fips-mode-setup --enable
      when:
        - "ciam_fips_mode | default(false)"
        - "ansible_facts.distribution in ['RedHat', 'Rocky', 'AlmaLinux', 'CentOS', 'OracleLinux']"
        - "ansible_facts.distribution_major_version | int in [8, 9]"
        - "(ciam_fips_now.content | b64decode | trim) != '1'"
      changed_when: true
      notify: FIPS mode needs a reboot
      tags:
        - baseline
    - name: "FIPS mode on (RHEL 10: chosen at installation)"
      ansible.builtin.assert:
        that: "(ciam_fips_now.content | b64decode | trim) == '1'"
        fail_msg: "RHEL 10 can't switch to FIPS mode after installation: reinstall with fips=1 on the kernel command line"
      when:
        - "ciam_fips_mode | default(false)"
        - "ansible_facts.distribution in ['RedHat', 'Rocky', 'AlmaLinux', 'CentOS', 'OracleLinux']"
        - "ansible_facts.distribution_major_version | int >= 10"
      tags:
        - baseline
    - name: FIPS mode not set here
      ansible.builtin.debug:
        msg: >-
          FIPS mode is recorded on, but this play sets it only on RHEL 8 and 9 (and their rebuilds); {{ ansible_facts.distribution }} {{
          ansible_facts.distribution_version }}: set it as its vendor documents
      when:
        - "ciam_fips_mode | default(false)"
        - "not (ansible_facts.distribution in ['RedHat', 'Rocky', 'AlmaLinux', 'CentOS', 'OracleLinux']) or ansible_facts.distribution_major_version | int < 8"
      tags:
        - baseline
    - name: Certificates the truststore adds, as system trust anchors
      ansible.builtin.copy:
        dest: "{{ ciam_trust_dir }}/opsdir-{{ item.name }}.crt"
        content: "{{ item.pem }}"
        mode: "0644"
      loop: "{{ ciam_trusted_certificates | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      notify: Update the system trust store
      tags:
        - baseline
    - name: Certificates with no PEM recorded
      ansible.builtin.debug:
        msg: "Not added (record their PEM, ciamCertificatePem): {{ ciam_trusted_unrecorded | join(', ') }}"
      when: "ciam_trusted_unrecorded | default([]) | length > 0"
      tags:
        - baseline
    - name: "DISA STIG (Red Hat's role for this RHEL release)"
      ansible.builtin.include_role:
        name: "RedHatOfficial.rhel{{ ansible_facts.distribution_major_version }}_stig"
        apply:
          tags:
            - stig
      when:
        - "ciam_hardening_profile | default('') == 'disa-stig'"
        - "ansible_facts.distribution == 'RedHat' and ansible_facts.distribution_major_version | int in [8, 9, 10]"
      tags:
        - stig
    - name: DISA STIG not applied here
      ansible.builtin.debug:
        msg: >-
          The disa-stig profile is recorded, but its roles are Red Hat's, for RHEL 8 to 10: {{ ansible_facts.distribution }} {{
          ansible_facts.distribution_version }} isn't hardened
      when:
        - "ciam_hardening_profile | default('') == 'disa-stig'"
        - "not (ansible_facts.distribution == 'RedHat' and ansible_facts.distribution_major_version | int in [8, 9, 10])"
      tags:
        - stig
    - name: Cron jobs
      ansible.builtin.cron:
        name: "{{ item.name }}"
        job: "{{ item.job }}"
        user: "{{ item.user }}"
        minute: "{{ item.minute | default(omit) }}"
        hour: "{{ item.hour | default(omit) }}"
        day: "{{ item.day | default(omit) }}"
        month: "{{ item.month | default(omit) }}"
        weekday: "{{ item.weekday | default(omit) }}"
        special_time: "{{ item.special_time | default(omit) }}"
      loop: "{{ ciam_cron_jobs | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - jobs
    - name: "Timer jobs' services"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.unit }}.service"
        content: |
          [Unit]
          Description={{ item.description }}

          [Service]
          Type=oneshot
          User={{ item.user }}
          ExecStart={{ item.exec_start }}
        mode: "0644"
      loop: "{{ ciam_timer_jobs | default([]) }}"
      loop_control:
        label: "{{ item.unit }}"
      tags:
        - jobs
    - name: "Timer jobs' timers"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.unit }}.timer"
        content: |
          [Unit]
          Description={{ item.description }}

          [Timer]
          {{ item.schedule | join('\n') }}

          [Install]
          WantedBy=timers.target
        mode: "0644"
      loop: "{{ ciam_timer_jobs | default([]) }}"
      loop_control:
        label: "{{ item.unit }}"
      tags:
        - jobs
    - name: Timer jobs enabled
      ansible.builtin.systemd_service:
        name: "{{ item.unit }}.timer"
        enabled: true
        state: started
        daemon_reload: true
      loop: "{{ ciam_timer_jobs | default([]) }}"
      loop_control:
        label: "{{ item.unit }}"
      tags:
        - jobs
    - name: Jobs not deployed
      ansible.builtin.debug:
        msg: "Their command isn't recorded (it held a secret): {{ ciam_jobs_not_deployed | join(', ') }}"
      when: "ciam_jobs_not_deployed | default([]) | length > 0"
      tags:
        - jobs
    - name: Time sync installed
      ansible.builtin.package:
        name: chrony
        state: present
      when: "ciam_time_sources | default([]) | length > 0"
      tags:
        - time
    - name: "Only the recorded time sources (the distribution's default pools removed)"
      ansible.builtin.lineinfile:
        path: "{{ '/etc/chrony.conf' if ansible_facts.os_family == 'RedHat' else '/etc/chrony/chrony.conf' }}"
        regexp: "^pool "
        state: absent
      when: "ciam_time_sources | default([]) | length > 0"
      notify: Restart time sync
      tags:
        - time
    - name: The recorded time sources
      ansible.builtin.blockinfile:
        path: "{{ '/etc/chrony.conf' if ansible_facts.os_family == 'RedHat' else '/etc/chrony/chrony.conf' }}"
        marker: "# {mark} opsdir time sources"
        block: |-
          {% for s in ciam_time_sources %}server {{ s }} iburst
          {% endfor %}
      when: "ciam_time_sources | default([]) | length > 0"
      notify: Restart time sync
      tags:
        - time
    - name: Time sync running
      ansible.builtin.systemd_service:
        name: "{{ 'chronyd' if ansible_facts.os_family == 'RedHat' else 'chrony' }}"
        enabled: true
        state: started
      when: "ciam_time_sources | default([]) | length > 0"
      tags:
        - time
    - name: Host firewall running
      ansible.builtin.systemd_service:
        name: firewalld
        enabled: true
        state: started
      when: "ciam_firewall_rules | default([]) | length > 0"
      tags:
        - firewall
    - name: Host firewall rules
      ansible.posix.firewalld:
        rich_rule: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop: "{{ ciam_firewall_rules | default([]) }}"
      tags:
        - firewall
    - name: Product configuration files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        mode: "0640"
      loop: "{{ ciam_config_files | default([]) }}"
      loop_control:
        label: "{{ item.dest }}"
      diff: false
      tags:
        - files
    - name: Product configuration files not deployed
      ansible.builtin.debug:
        msg: "{{ ciam_config_files_not_deployed | join('; ') }}"
      when: "ciam_config_files_not_deployed | default([]) | length > 0"
      run_once: true
      tags:
        - files
    - name: OS release
      ansible.builtin.shell:
        cmd: ". /etc/os-release && echo \"$ID $VERSION_ID\""
      register: ciam_os_now
      changed_when: false
      check_mode: false
      when: ciam_os is defined
      tags:
        - verify
        - never
    - name: OS as recorded
      ansible.builtin.assert:
        that: ciam_os_now.stdout == ciam_os
        fail_msg: "runs {{ ciam_os_now.stdout }}; the record says {{ ciam_os }}"
      when: ciam_os is defined
      tags:
        - verify
        - never
    - name: Installed packages
      ansible.builtin.package_facts: {}
      tags:
        - verify
        - never
    - name: Agents installed
      ansible.builtin.assert:
        that: item.package in ansible_facts.packages
        fail_msg: "agent {{ item.recorded }} isn't installed"
      loop: "{{ ciam_host_agents | default([]) }}"
      loop_control:
        label: "{{ item.package }}"
      tags:
        - verify
        - never
    - name: Services
      ansible.builtin.service_facts: {}
      tags:
        - verify
        - never
    - name: Service units enabled
      ansible.builtin.assert:
        that: "item in ansible_facts.services and ansible_facts.services[item].status == 'enabled'"
        fail_msg: "service unit {{ item }} isn't enabled"
      loop: "{{ ciam_service_units | default([]) }}"
      tags:
        - verify
        - never
  handlers:
    - name: Apply transparent huge pages
      ansible.builtin.systemd_service:
        name: ciam-transparent-hugepages.service
        state: restarted
        daemon_reload: true
    - name: Update the system trust store
      ansible.builtin.command:
        cmd: "{{ 'update-ca-trust extract' if ansible_facts.os_family == 'RedHat' else 'update-ca-certificates' }}"
      changed_when: true
    - name: Restart time sync
      ansible.builtin.systemd_service:
        name: "{{ 'chronyd' if ansible_facts.os_family == 'RedHat' else 'chrony' }}"
        state: restarted
    - name: FIPS mode needs a reboot
      ansible.builtin.debug:
        msg: "FIPS mode enabled: reboot the host for it to take effect (this play doesn't reboot)"
