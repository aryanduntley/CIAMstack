# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# Writes the alerting rules on the monitoring servers
# Do not edit. Change the operations directory (under an approved change) and re-render.
- name: Prometheus alerting rules (opsdir)
  hosts: monitoring
  become: true
  tasks:
    - name: Rules folder
      ansible.builtin.file:
        path: /etc/prometheus/rules
        state: directory
        mode: "0755"
    - name: Alerting rules, checked by promtool before they replace the running ones
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../prometheus/rules/ciam.rules.yml"
        dest: /etc/prometheus/rules/ciam.rules.yml
        mode: "0644"
        validate: "promtool check rules %s"
      notify: Reload Prometheus
  handlers:
    - name: Reload Prometheus
      ansible.builtin.systemd_service:
        name: prometheus
        state: reloaded
