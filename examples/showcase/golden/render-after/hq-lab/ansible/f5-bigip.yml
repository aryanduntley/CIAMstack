# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# Deploys the service names' AS3 declaration to the BIG-IPs, one request per tenant (check first: --tags dry-run)
# Do not edit. Change the operations directory (under an approved change) and re-render.
- name: Service names on the BIG-IPs, tenant CIAM_Lab, as one AS3 declaration (opsdir)
  hosts: "f5_CIAM_Lab[0]"
  gather_facts: false
  tasks:
    - name: Check the AS3 declaration (not deployed)
      f5networks.f5_bigip.bigip_as3_deploy:
        content: "{{ lookup('ansible.builtin.file', 'f5/as3-CIAM_Lab.json') }}"
        tenant: CIAM_Lab
        state: present
        timeout: 300
        controls:
          dry_run: true
      tags:
        - dry-run
        - never
    - name: Deploy the AS3 declaration
      f5networks.f5_bigip.bigip_as3_deploy:
        content: "{{ lookup('ansible.builtin.file', 'f5/as3-CIAM_Lab.json') }}"
        tenant: CIAM_Lab
        state: present
        timeout: 300
      tags:
        - deploy
