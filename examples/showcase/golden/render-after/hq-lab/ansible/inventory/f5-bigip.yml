# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# The BIG-IPs (load-balancer appliances), by tenant
# Do not edit. Change the operations directory (under an approved change) and re-render.
all:
  children:
    f5_bigip:
      children:
        f5_CIAM_Lab:
          hosts:
            bigip-hq:
              ansible_host: bigip-1.mgmt.hq.example-aero.internal
              ansible_connection: ansible.netcommon.httpapi
              ansible_network_os: f5networks.f5_bigip.bigip
              ansible_httpapi_use_ssl: true
              ansible_httpapi_validate_certs: true
              ansible_httpapi_port: 443
              ansible_user: svc-opsdir
              ansible_httpapi_password: >-
                {{ lookup("ansible.builtin.pipe", "clipasswordsdk GetPassword -p AppDescs.AppID='ciam-lab' -p Query='Safe=CIAM-Lab;Object=bigip-hq' -o
                Password") }}
