# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# The Panorama or firewalls (network-firewall appliances)
# Do not edit. Change the operations directory (under an approved change) and re-render.
all:
  children:
    panos:
      hosts:
        panorama-hq:
          ansible_connection: local
          ansible_python_interpreter: "{{ ansible_playbook_python }}"
          ciam_panos_device_group: CIAM-Lab
          ciam_panos_provider:
            ip_address: panorama.mgmt.hq.example-aero.internal
            username: svc-opsdir
            password: >-
              {{ lookup("ansible.builtin.pipe", "clipasswordsdk GetPassword -p AppDescs.AppID='ciam-lab' -p Query='Safe=CIAM-Lab;Object=panorama-hq' -o
              Password") }}
