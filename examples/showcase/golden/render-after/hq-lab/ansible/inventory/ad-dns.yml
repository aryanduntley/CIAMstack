all:
  children:
    ad_dns:
      hosts:
        dc-hq:
          ansible_host: dc01.corp.example-aero.internal
          ansible_connection: ansible.builtin.psrp
          ansible_port: 5986
          ansible_psrp_protocol: https
          ansible_psrp_auth: negotiate
          ansible_psrp_cert_validation: validate
          ansible_user: svc-opsdir
          ansible_password: >-
            {{ lookup("ansible.builtin.pipe", "clipasswordsdk GetPassword -p AppDescs.AppID='ciam-lab' -p Query='Safe=CIAM-Lab;Object=dc-hq' -o Password") }}
