# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# Variables role pf-engine's hosts read
# Do not edit. Change the operations directory (under an approved change) and re-render.
ciam_role: pf-engine
ciam_os: rhel 9.4
ciam_jdk: temurin 17.0.11
ciam_kernel_settings:
  - name: net.core.somaxconn
    value: "4096"
  - name: net.ipv4.tcp_keepalive_time
    value: "600"
ciam_limits:
  - domain: pingfed
    type: soft
    item: nofile
    value: "65536"
  - domain: pingfed
    type: hard
    item: nofile
    value: "65536"
ciam_transparent_hugepages: never
ciam_fips_mode: false
ciam_selinux_mode: enforcing
ciam_trusted_unrecorded:
  - example-aero-corp-root-ca
ciam_host_agents:
  - package: falcon-sensor
    recorded: falcon-sensor 7.10.0
  - package: splunkforwarder
    recorded: splunkforwarder 9.2.1
  - package: katello-host-tools
    recorded: katello-host-tools 4.4.0
  - package: insights-client
    recorded: insights-client 3.2.2
ciam_service_units:
  - pingfederate.service
ciam_timer_jobs:
  - unit: opsdir-pf-engine-pf-audit-ship
    description: pf-engine-pf-audit-ship (opsdir)
    exec_start: "/bin/sh -c \"/opt/scripts/ship-audit.sh /opt/pingfederate/log/audit.log\""
    user: pingfed
    schedule:
      - "OnCalendar=*:0/15"
ciam_firewall_rules:
  - "rule family=\"ipv4\" source address=\"10.80.4.0/24\" port port=\"7600\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.80.4.0/24\" port port=\"7700\" protocol=\"tcp\" accept"
  - "rule family=\"ipv4\" source address=\"10.0.0.0/8\" port port=\"443\" protocol=\"tcp\" accept"
ciam_config_files:
  - src: pingfederate/bin/run.properties.j2
    dest: /opt/pingfederate/bin/run.properties
