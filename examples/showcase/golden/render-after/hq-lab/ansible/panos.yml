# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# Pushes the record's firewall rules to Palo Alto Networks (commit: --tags commit)
# Do not edit. Change the operations directory (under an approved change) and re-render.
- name: "The record's firewall rules on Palo Alto Networks (opsdir)"
  hosts: panos
  gather_facts: false
  vars:
    ciam_panos:
      addresses:
        - name: opsdir-10.80.4.0_24
          value: "10.80.4.0/24"
          address_type: ip-netmask
        - name: opsdir-hq-lab-ds-1
          value: "10.80.1.11"
          address_type: ip-netmask
        - name: opsdir-hq-lab-ds-2
          value: "10.80.1.12"
          address_type: ip-netmask
        - name: opsdir-10.80.9.32_28
          value: "10.80.9.32/28"
          address_type: ip-netmask
        - name: opsdir-10.80.1.0_24
          value: "10.80.1.0/24"
          address_type: ip-netmask
        - name: opsdir-10.80.9.0_28
          value: "10.80.9.0/28"
          address_type: ip-netmask
        - name: opsdir-10.0.0.0_8
          value: "10.0.0.0/8"
          address_type: ip-netmask
        - name: opsdir-hq-lab-pf-engine-1
          value: "10.80.4.11"
          address_type: ip-netmask
        - name: opsdir-hq-lab-pf-admin-1
          value: "10.80.4.12"
          address_type: ip-netmask
      services:
        - name: opsdir-tcp-1636
          protocol: tcp
          destination_port: "1636"
        - name: opsdir-tcp-8989
          protocol: tcp
          destination_port: "8989"
        - name: opsdir-tcp-4444
          protocol: tcp
          destination_port: "4444"
        - name: opsdir-tcp-443
          protocol: tcp
          destination_port: "443"
        - name: opsdir-tcp-7600
          protocol: tcp
          destination_port: "7600"
        - name: opsdir-tcp-7700
          protocol: tcp
          destination_port: "7700"
      rules:
        - rule_name: opsdir-hq-lab-fw-pf-ds-svc
          source_ip:
            - opsdir-10.80.4.0_24
          destination_ip:
            - opsdir-hq-lab-ds-1
            - opsdir-hq-lab-ds-2
          service:
            - opsdir-tcp-1636
          description: "opsdir hq/lab: fw-pf-ds-svc -> role ds"
          after: null
        - rule_name: opsdir-hq-lab-fw-lb-ldaps
          source_ip:
            - opsdir-10.80.9.32_28
          destination_ip:
            - opsdir-hq-lab-ds-1
            - opsdir-hq-lab-ds-2
          service:
            - opsdir-tcp-1636
          description: "opsdir hq/lab: fw-lb-ldaps -> role ds"
          after: opsdir-hq-lab-fw-pf-ds-svc
        - rule_name: opsdir-hq-lab-fw-replication
          source_ip:
            - opsdir-10.80.1.0_24
          destination_ip:
            - opsdir-hq-lab-ds-1
            - opsdir-hq-lab-ds-2
          service:
            - opsdir-tcp-8989
          description: "opsdir hq/lab: fw-replication -> role ds"
          after: opsdir-hq-lab-fw-lb-ldaps
        - rule_name: opsdir-hq-lab-fw-admin
          source_ip:
            - opsdir-10.80.9.0_28
          destination_ip:
            - opsdir-hq-lab-ds-1
            - opsdir-hq-lab-ds-2
          service:
            - opsdir-tcp-4444
          description: "opsdir hq/lab: fw-admin -> role ds"
          after: opsdir-hq-lab-fw-replication
        - rule_name: opsdir-hq-lab-fw-sso
          source_ip:
            - opsdir-10.0.0.0_8
          destination_ip:
            - opsdir-hq-lab-pf-engine-1
          service:
            - opsdir-tcp-443
          description: "opsdir hq/lab: fw-sso -> role pf-engine"
          after: opsdir-hq-lab-fw-admin
        - rule_name: opsdir-hq-lab-fw-pf-cluster
          source_ip:
            - opsdir-10.80.4.0_24
          destination_ip:
            - opsdir-hq-lab-pf-engine-1
          service:
            - opsdir-tcp-7600
            - opsdir-tcp-7700
          description: "opsdir hq/lab: fw-pf-cluster -> role pf-engine"
          after: opsdir-hq-lab-fw-sso
        - rule_name: opsdir-hq-lab-fw-pf-cluster-admin
          source_ip:
            - opsdir-10.80.4.0_24
          destination_ip:
            - opsdir-hq-lab-pf-admin-1
          service:
            - opsdir-tcp-7600
            - opsdir-tcp-7700
          description: "opsdir hq/lab: fw-pf-cluster-admin -> role pf-admin"
          after: opsdir-hq-lab-fw-pf-cluster
    ciam_panos_marker: "opsdir hq/lab:"
  tasks:
    - name: The login, read once
      ansible.builtin.set_fact:
        ciam_panos_login: "{{ ciam_panos_provider }}"
      no_log: true
      tags:
        - always
    - name: Address objects
      paloaltonetworks.panos.panos_address_object:
        device_group: "{{ ciam_panos_device_group | default(omit) }}"
        vsys: "{{ ciam_panos_vsys | default(omit) }}"
        provider: "{{ ciam_panos_login }}"
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        address_type: "{{ item.address_type }}"
      loop: "{{ ciam_panos.addresses }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - rules
    - name: Service objects
      paloaltonetworks.panos.panos_service_object:
        device_group: "{{ ciam_panos_device_group | default(omit) }}"
        vsys: "{{ ciam_panos_vsys | default(omit) }}"
        provider: "{{ ciam_panos_login }}"
        name: "{{ item.name }}"
        protocol: "{{ item.protocol }}"
        destination_port: "{{ item.destination_port }}"
      loop: "{{ ciam_panos.services }}"
      loop_control:
        label: "{{ item.name }}"
      tags:
        - rules
    - name: The rules this environment wrote, as the firewall has them
      paloaltonetworks.panos.panos_security_rule:
        device_group: "{{ ciam_panos_device_group | default(omit) }}"
        vsys: "{{ ciam_panos_vsys | default(omit) }}"
        provider: "{{ ciam_panos_login }}"
        rulebase: "{{ 'pre-rulebase' if ciam_panos_device_group is defined else omit }}"
        rule_name: "{{ ciam_panos_marker }}"
        state: gathered
        gathered_filter: "description starts-with '{{ ciam_panos_marker }}'"
      register: ciam_panos_rules_now
      tags:
        - rules
    - name: Security rules
      paloaltonetworks.panos.panos_security_rule:
        device_group: "{{ ciam_panos_device_group | default(omit) }}"
        vsys: "{{ ciam_panos_vsys | default(omit) }}"
        provider: "{{ ciam_panos_login }}"
        rulebase: "{{ 'pre-rulebase' if ciam_panos_device_group is defined else omit }}"
        rule_name: "{{ item.rule_name }}"
        description: "{{ item.description }}"
        source_ip: "{{ item.source_ip }}"
        destination_ip: "{{ item.destination_ip }}"
        service: "{{ item.service }}"
        action: allow
        log_end: true
        source_zone: "{{ ciam_rule_now.source_zone | default(['any'], true) }}"
        destination_zone: "{{ ciam_rule_now.destination_zone | default(['any'], true) }}"
        application: "{{ ciam_rule_now.application | default(['any'], true) }}"
        source_user: "{{ ciam_rule_now.source_user | default(omit, true) }}"
        category: "{{ ciam_rule_now.category | default(omit, true) }}"
        hip_profiles: "{{ ciam_rule_now.hip_profiles | default(omit, true) }}"
        tag_name: "{{ ciam_rule_now.tag_name | default(omit, true) }}"
        group_tag: "{{ ciam_rule_now.group_tag | default(omit, true) }}"
        log_setting: "{{ ciam_rule_now.log_setting | default(omit, true) }}"
        log_start: "{{ ciam_rule_now.log_start | default(omit, true) }}"
        schedule: "{{ ciam_rule_now.schedule | default(omit, true) }}"
        rule_type: "{{ ciam_rule_now.rule_type | default(omit, true) }}"
        group_profile: "{{ ciam_rule_now.group_profile | default(omit, true) }}"
        antivirus: "{{ ciam_rule_now.antivirus | default(omit, true) }}"
        spyware: "{{ ciam_rule_now.spyware | default(omit, true) }}"
        vulnerability: "{{ ciam_rule_now.vulnerability | default(omit, true) }}"
        url_filtering: "{{ ciam_rule_now.url_filtering | default(omit, true) }}"
        file_blocking: "{{ ciam_rule_now.file_blocking | default(omit, true) }}"
        wildfire_analysis: "{{ ciam_rule_now.wildfire_analysis | default(omit, true) }}"
        data_filtering: "{{ ciam_rule_now.data_filtering | default(omit, true) }}"
        disabled: "{{ ciam_rule_now.disabled | default(omit, true) }}"
        negate_source: "{{ ciam_rule_now.negate_source | default(omit, true) }}"
        negate_destination: "{{ ciam_rule_now.negate_destination | default(omit, true) }}"
        icmp_unreachable: "{{ ciam_rule_now.icmp_unreachable | default(omit, true) }}"
        disable_server_response_inspection: "{{ ciam_rule_now.disable_server_response_inspection | default(omit, true) }}"
        location: "{{ omit if ciam_rule_now else ('after' if item.after else 'top') }}"
        existing_rule: "{{ omit if (ciam_rule_now or not item.after) else item.after }}"
        state: present
      loop: "{{ ciam_panos.rules }}"
      loop_control:
        label: "{{ item.rule_name }}"
      vars:
        ciam_rule_now: "{{ ciam_panos_rules_now.gathered | default([]) | selectattr('rule_name', 'equalto', item.rule_name) | first | default({}) }}"
      tags:
        - rules
    - name: Rules this environment wrote before and the record no longer holds, removed
      paloaltonetworks.panos.panos_security_rule:
        device_group: "{{ ciam_panos_device_group | default(omit) }}"
        vsys: "{{ ciam_panos_vsys | default(omit) }}"
        provider: "{{ ciam_panos_login }}"
        rulebase: "{{ 'pre-rulebase' if ciam_panos_device_group is defined else omit }}"
        rule_name: "{{ item.rule_name }}"
        state: absent
      loop: "{{ ciam_panos_rules_now.gathered | default([]) | rejectattr('rule_name', 'in', ciam_panos.rules | map(attribute='rule_name') | list) | list }}"
      loop_control:
        label: "{{ item.rule_name }}"
      tags:
        - rules
    - name: "Commit on Panorama (the opsdir login's changes, the device group)"
      paloaltonetworks.panos.panos_commit_panorama:
        provider: "{{ ciam_panos_login }}"
        admins:
          - "{{ ciam_panos_login.username }}"
        device_groups:
          - "{{ ciam_panos_device_group }}"
      when: ciam_panos_device_group is defined
      tags:
        - commit
        - never
    - name: "Push to the device group (the opsdir login's changes)"
      paloaltonetworks.panos.panos_commit_push:
        provider: "{{ ciam_panos_login }}"
        style: device group
        admins:
          - "{{ ciam_panos_login.username }}"
        name: "{{ ciam_panos_device_group }}"
      when: ciam_panos_device_group is defined
      tags:
        - commit
        - never
    - name: "Commit on the firewall (the opsdir login's changes)"
      paloaltonetworks.panos.panos_commit_firewall:
        provider: "{{ ciam_panos_login }}"
        admins:
          - "{{ ciam_panos_login.username }}"
      when: not (ciam_panos_device_group is defined)
      tags:
        - commit
        - never
