# Generated by opsdir from env=lab,cloud=hq,ou=environments,dc=ciam-ops
# Writes the environment's DNS records on its Windows DNS servers
# Do not edit. Change the operations directory (under an approved change) and re-render.
- name: "The environment's DNS records on its Windows DNS servers (opsdir)"
  hosts: ad_dns
  gather_facts: false
  vars:
    ciam_dns_records:
      - zone: lab.example-aero.test
        name: ldap
        type: A
        values:
          - "10.80.1.100"
        ttl: 300
      - zone: lab.example-aero.test
        name: sso
        type: A
        values:
          - "10.80.4.100"
        ttl: 300
    ciam_dns_srv: []
    ciam_dns_not_written: []
    ciam_dns_ledger: _opsdir-hq-lab
    ciam_dns_zones:
      - zone: lab.example-aero.test
        managed:
          - A ldap 10.80.1.100
          - A sso 10.80.4.100
  tasks:
    - name: DNS records
      ansible.windows.win_dns_record:
        computer_name: "{{ ciam_dns_server | default(omit) }}"
        zone: "{{ item.zone }}"
        name: "{{ item.name }}"
        type: "{{ item.type }}"
        value: "{{ item.values }}"
        ttl: "{{ item.ttl }}"
        state: present
      loop: "{{ ciam_dns_records }}"
      loop_control:
        label: "{{ item.type }} {{ item.name }}"
    - name: SRV records
      ansible.windows.win_dns_record:
        computer_name: "{{ ciam_dns_server | default(omit) }}"
        zone: "{{ item.zone }}"
        name: "{{ item.name }}"
        type: SRV
        value: "{{ item.targets }}"
        priority: "{{ item.priority }}"
        weight: "{{ item.weight }}"
        port: "{{ item.port }}"
        ttl: "{{ item.ttl }}"
        state: present
      loop: "{{ ciam_dns_srv }}"
      loop_control:
        label: "SRV {{ item.name }}"
    - name: Records this environment wrote before and the record no longer holds, removed
      ansible.windows.win_powershell:
        script: |
          [CmdletBinding(SupportsShouldProcess)]
          param([string]$Zone, [string]$Ledger, [string[]]$Managed, [string]$Server)
          $where = @{ ZoneName = $Zone }
          if ($Server) { $where.ComputerName = $Server }
          $data = @{ A = 'IPv4Address'; AAAA = 'IPv6Address'; CNAME = 'HostNameAlias'; NS = 'NameServer';
              PTR = 'PtrDomainName'; SRV = 'DomainName'; TXT = 'DescriptiveText' }
          function Get-Digest([string]$Text) {
              $sha = [System.Security.Cryptography.SHA256]::Create()
              $hex = -join ($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($Text)) | ForEach-Object { $_.ToString('x2') })
              'sha256:' + $hex.Substring(0, 16)
          }
          $old = @(Get-DnsServerResourceRecord @where -Name $Ledger -RRType Txt -ErrorAction SilentlyContinue |
              ForEach-Object { $_.RecordData.DescriptiveText })
          $stale = @($old | Where-Object { $_ -and $Managed -notcontains $_ })
          $removed = @()
          $left = @()
          foreach ($entry in $stale) {
              $type, $name, $value = $entry -split ' ', 3
              if (-not $value -or -not $data.ContainsKey($type)) { $left += $entry; continue }
              if ($type -in 'CNAME', 'NS', 'PTR', 'SRV' -and $value -notlike 'sha256:*' -and $value -notlike '*.') {
                  $value = "$value."
              }
              $mine = @(Get-DnsServerResourceRecord @where -Name $name -RRType $type -ErrorAction SilentlyContinue |
                  Where-Object { $text = $_.RecordData.($data[$type]).ToString()
                                 $text -eq $value -or (Get-Digest $text) -eq $value })
              foreach ($record in $mine) {
                  if ($PSCmdlet.ShouldProcess("$type $name $value in $Zone", 'Remove')) {
                      $record | Remove-DnsServerResourceRecord @where -Force
                  }
                  $Ansible.Changed = $true
              }
              $removed += $entry
          }
          $Ansible.Result = @{ removed = $removed; left = $left }
        parameters:
          Zone: "{{ item.zone }}"
          Ledger: "{{ ciam_dns_ledger }}"
          Managed: "{{ item.managed }}"
          Server: "{{ ciam_dns_server | default('') }}"
      loop: "{{ ciam_dns_zones }}"
      loop_control:
        label: "{{ item.zone }}"
    - name: The ledger of what this environment wrote
      ansible.windows.win_dns_record:
        computer_name: "{{ ciam_dns_server | default(omit) }}"
        zone: "{{ item.zone }}"
        name: "{{ ciam_dns_ledger }}"
        type: TXT
        value: "{{ item.managed }}"
        state: "{{ 'present' if item.managed | length > 0 else 'absent' }}"
      loop: "{{ ciam_dns_zones }}"
      loop_control:
        label: "{{ item.zone }}"
    - name: "Records this play doesn't write"
      ansible.builtin.debug:
        msg: "Not written: {{ ciam_dns_not_written | join(', ') }}"
      when: "ciam_dns_not_written | length > 0"
