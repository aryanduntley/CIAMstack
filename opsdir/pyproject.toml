[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsdir"
version = "0.1.0"
description = "Database-first management of an identity platform: governed, typed, cross-referenced directory entries; adapters render and import the working configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1", "packaging>=23"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
opsdir = "opsdir.cli:run"

# The core registers its built-in, vendor-neutral domains through the same entry points any package can use.
[project.entry-points."opsdir.domains"]
infrastructure = "opsdir.domains.infrastructure.domain:DOMAIN"
directory = "opsdir.domains.directory.domain:DOMAIN"
federation = "opsdir.domains.federation.domain:DOMAIN"
pki = "opsdir.domains.pki.domain:DOMAIN"
governance = "opsdir.domains.governance.domain:DOMAIN"
custom = "opsdir.domains.custom.domain:DOMAIN"
configuration = "opsdir.domains.configuration.domain:DOMAIN"
automation = "opsdir.domains.automation.domain:DOMAIN"
compute = "opsdir.domains.compute.domain:DOMAIN"
messaging = "opsdir.domains.messaging.domain:DOMAIN"
observability = "opsdir.domains.observability.domain:DOMAIN"

# The standard file formats; packages register their own under the same group.
[project.entry-points."opsdir.formats"]
ldif = "opsdir.core.formats:LDIF"
json = "opsdir.core.formats:JSON"
xml = "opsdir.core.formats:XML"
yaml = "opsdir.core.formats:YAML"
shell = "opsdir.core.formats:SHELL"
java-properties = "opsdir.core.formats:JAVA_PROPERTIES"
ini = "opsdir.core.formats:INI"
toml = "opsdir.core.formats:TOML"
csv = "opsdir.core.formats:CSV"
c = "opsdir.core.formats:C"
javascript = "opsdir.core.formats:JAVASCRIPT"
groovy = "opsdir.core.formats:GROOVY"
python = "opsdir.core.formats:PYTHON"
powershell = "opsdir.core.formats:POWERSHELL"
sql = "opsdir.core.formats:SQL"
html = "opsdir.core.formats:HTML"
markdown = "opsdir.core.formats:MARKDOWN"
pem = "opsdir.core.formats:PEM"
text = "opsdir.core.formats:TEXT"

[tool.setuptools.packages.find]
include = ["opsdir*"]

[tool.setuptools.package-data]
"*" = ["sql/*.sql", "sql/migrations/*.sql", "sql/definitions/*.sql"]
