[pytest]
# .venv/bin/python -m pytest                   unit suite (no database)
# .venv/bin/python -m pytest -m integration    integration suite (Postgres; see tests/support.py integration_dsn)
# scripts/test.sh                              everything, database required
testpaths = tests
pythonpath = . tests
addopts = -ra -m "not integration"
markers =
    integration: runs the CLI against PostgreSQL (OPSDIR_TEST_DSN, else the local dev database); drops and reloads its opsdir schema
